name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Jellyfin.Plugin.JfPrewarm/Jellyfin.Plugin.JfPrewarm.csproj

      - name: Validate single version source
        shell: bash
        run: |
          VERSION="$(dotnet msbuild Jellyfin.Plugin.JfPrewarm/Jellyfin.Plugin.JfPrewarm.csproj -nologo -verbosity:quiet -getProperty:PluginVersion)"
          ASSEMBLY_VERSION="$(dotnet msbuild Jellyfin.Plugin.JfPrewarm/Jellyfin.Plugin.JfPrewarm.csproj -nologo -verbosity:quiet -getProperty:AssemblyVersion)"
          FILE_VERSION="$(dotnet msbuild Jellyfin.Plugin.JfPrewarm/Jellyfin.Plugin.JfPrewarm.csproj -nologo -verbosity:quiet -getProperty:FileVersion)"
          if [[ -z "$VERSION" || "$VERSION" != "$ASSEMBLY_VERSION" || "$VERSION" != "$FILE_VERSION" ]]; then
            echo "::error::Plugin version properties are inconsistent (PluginVersion=$VERSION, AssemblyVersion=$ASSEMBLY_VERSION, FileVersion=$FILE_VERSION)"
            exit 1
          fi
          echo "Using plugin version $VERSION"

      - name: Build
        run: dotnet build Jellyfin.Plugin.JfPrewarm/Jellyfin.Plugin.JfPrewarm.csproj --configuration Release --no-restore

      - name: Validate metadata
        run: |
          jq -e '.version and .targetAbi and .changelog' meta.json >/dev/null
          jq -e '.[0].guid == "d1c4b6e8-8e2a-4b63-9f13-7a2e5d9c41f0"' manifest.json >/dev/null
