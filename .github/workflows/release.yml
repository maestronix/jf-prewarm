name: Build and Release Jellyfin Plugin

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_and_release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Resolve version from single source
        id: version
        shell: bash
        run: |
          VERSION="$(dotnet msbuild Jellyfin.Plugin.JfPrewarm/Jellyfin.Plugin.JfPrewarm.csproj -nologo -verbosity:quiet -getProperty:PluginVersion)"
          if [[ -z "$VERSION" ]]; then
            echo "::error::Could not read PluginVersion from Directory.Build.props"
            exit 1
          fi

          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            if [[ "$TAG_VERSION" != "$VERSION" ]]; then
              echo "::error::Tag version $TAG_VERSION does not match Directory.Build.props version $VERSION"
              exit 1
            fi
          fi

          TARGET_ABI="$(jq -r '.targetAbi' meta.json)"
          jq --arg version "$VERSION" '.version = $version' meta.json > meta.tmp
          mv meta.tmp meta.json
          sed -i -E "s/^version:.*/version: $VERSION/" build.yaml

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "target_abi=$TARGET_ABI" >> "$GITHUB_OUTPUT"
          {
            echo "changelog<<EOF"
            jq -r '.changelog' meta.json
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Restore and build
        run: |
          dotnet restore Jellyfin.Plugin.JfPrewarm/Jellyfin.Plugin.JfPrewarm.csproj
          dotnet build Jellyfin.Plugin.JfPrewarm/Jellyfin.Plugin.JfPrewarm.csproj --configuration Release --no-restore

      - name: Verify assembly version
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ASSEMBLY_VERSION="$(dotnet msbuild Jellyfin.Plugin.JfPrewarm/Jellyfin.Plugin.JfPrewarm.csproj -nologo -verbosity:quiet -getProperty:AssemblyVersion)"
          if [[ "$ASSEMBLY_VERSION" != "$VERSION" ]]; then
            echo "::error::Assembly version $ASSEMBLY_VERSION does not match plugin version $VERSION"
            exit 1
          fi

      - name: Package plugin
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          PLUGIN="Jellyfin.Plugin.JfPrewarm"
          mkdir -p release_package
          cp "Jellyfin.Plugin.JfPrewarm/bin/Release/net10.0/$PLUGIN.dll" release_package/
          cp meta.json release_package/
          ZIP="${PLUGIN}_v${VERSION}.zip"
          (cd release_package && zip -9 -r "../$ZIP" .)
          md5sum "$ZIP" | awk '{print toupper($1)}' > checksum.txt
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Episode Prewarm v${{ steps.version.outputs.version }}
          body: ${{ steps.version.outputs.changelog }}
          generate_release_notes: true
          files: |
            ${{ env.ZIP }}
            checksum.txt

      - name: Update Jellyfin repository manifest
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TARGET_ABI="${{ steps.version.outputs.target_abi }}"
          CHANGELOG="${{ steps.version.outputs.changelog }}"
          TIMESTAMP="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          CHECKSUM="$(cat checksum.txt)"
          ZIP="${{ env.ZIP }}"
          SOURCE_URL="https://github.com/${{ github.repository }}/releases/download/v${VERSION}/${ZIP}"

          jq \
            --arg version "$VERSION" \
            --arg targetAbi "$TARGET_ABI" \
            --arg changelog "$CHANGELOG" \
            --arg checksum "$CHECKSUM" \
            --arg sourceUrl "$SOURCE_URL" \
            --arg timestamp "$TIMESTAMP" \
            '.[0].versions = ([{
              version: $version,
              changelog: $changelog,
              targetAbi: $targetAbi,
              sourceUrl: $sourceUrl,
              checksum: $checksum,
              timestamp: $timestamp
            }] + [.[0].versions[] | select(.version != $version)])' manifest.json > manifest.tmp

          mv manifest.tmp manifest.json

      - name: Commit generated metadata and manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add meta.json build.yaml manifest.json
          git diff --cached --quiet || git commit -m "Publish Jellyfin repository manifest for v${{ steps.version.outputs.version }}"
          git push origin HEAD:main
