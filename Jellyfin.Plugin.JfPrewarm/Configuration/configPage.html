<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Episode Prewarm</title>
</head>
<body>
<div id="JfPrewarmConfigPage" data-role="page" class="page type-interior pluginConfigurationPage" data-require="emby-input,emby-button">
    <div data-role="content">
        <div class="content-primary">
            <form id="JfPrewarmConfigForm">
                <div class="sectionTitleContainer">
                    <h2 class="sectionTitle">Episode Prewarm</h2>
                </div>
                <div class="inputContainer">
                    <label class="inputLabel" for="TriggerPercent">Playback trigger threshold (%)</label>
                    <input id="TriggerPercent" name="TriggerPercent" type="number" is="emby-input" min="1" max="99" step="1" required />
                    <div class="fieldDescription">Preload the next episode when playback reaches this percentage. Default: 90%.</div>
                </div>
                <div class="fieldDescription" id="SaveStatus" role="status" aria-live="polite"></div>
                <div class="sectionTitleContainer">
                    <h2 class="sectionTitle">Runtime statistics</h2>
                </div>
                <div class="paperList">
                    <div class="listItem"><div class="listItemBody"><div>Preload attempts</div></div><div id="Attempts">Loading…</div></div>
                    <div class="listItem"><div class="listItemBody"><div>Successful preloads</div></div><div id="Successes">Loading…</div></div>
                    <div class="listItem"><div class="listItemBody"><div>Failed preloads</div></div><div id="Failures">Loading…</div></div>
                    <div class="listItem"><div class="listItemBody"><div>Total bytes read</div></div><div id="BytesRead">Loading…</div></div>
                </div>
                <div class="inputContainer">
                    <label class="inputLabel">Last result</label>
                    <div id="LastResult" class="fieldDescription">Loading…</div>
                </div>
                <div class="fieldDescription">Read size: fixed at 1 MiB. Cooldown: 1 second (development setting).</div>
                <br />
                <button id="SaveButton" is="emby-button" type="submit" class="raised button-submit">
                    <span>Save</span>
                </button>
            </form>
        </div>
    </div>
</div>
<script type="text/javascript">
(function () {
    const pluginId = 'd1c4b6e8-8e2a-4b63-9f13-7a2e5d9c41f0';
    const page = document.querySelector('#JfPrewarmConfigPage');
    if (!page || page.dataset.initialized === 'true') {
        return;
    }
    page.dataset.initialized = 'true';

    const form = page.querySelector('#JfPrewarmConfigForm');
    const thresholdInput = page.querySelector('#TriggerPercent');
    const saveButton = page.querySelector('#SaveButton');
    const saveStatus = page.querySelector('#SaveStatus');

    function getValue(config, propertyName, fallback) {
        const value = config[propertyName];
        return value !== undefined && value !== null ? value : fallback;
    }

    function renderConfiguration(config) {
        thresholdInput.value = getValue(config, 'TriggerPercent', 90);
        page.querySelector('#Attempts').textContent = getValue(config, 'PreloadAttempts', 0).toLocaleString();
        page.querySelector('#Successes').textContent = getValue(config, 'SuccessfulPreloads', 0).toLocaleString();
        page.querySelector('#Failures').textContent = getValue(config, 'FailedPreloads', 0).toLocaleString();
        page.querySelector('#BytesRead').textContent = Number(getValue(config, 'BytesRead', 0)).toLocaleString();
        page.querySelector('#LastResult').textContent = getValue(config, 'LastResult', 'No preload attempts yet.');
    }

    function loadConfiguration() {
        saveStatus.textContent = 'Loading configuration…';
        Dashboard.showLoadingMsg();

        ApiClient.getPluginConfiguration(pluginId)
            .then(config => {
                renderConfiguration(config);
                saveStatus.textContent = '';
            })
            .catch(error => {
                console.error('Episode Prewarm: failed to load plugin configuration.', error);
                saveStatus.textContent = 'Could not load plugin configuration: ' + (error?.message || error);
                page.querySelector('#LastResult').textContent = 'Configuration could not be loaded.';
            })
            .finally(() => {
                Dashboard.hideLoadingMsg();
            });
    }

    function saveConfiguration(event) {
        event.preventDefault();

        const value = Number(thresholdInput.value);
        if (!Number.isInteger(value) || value < 1 || value > 99) {
            saveStatus.textContent = 'Enter a whole number between 1 and 99.';
            thresholdInput.focus();
            return false;
        }

        saveButton.disabled = true;
        saveStatus.textContent = 'Saving…';
        Dashboard.showLoadingMsg();

        ApiClient.getPluginConfiguration(pluginId)
            .then(config => {
                config.TriggerPercent = value;
                return ApiClient.updatePluginConfiguration(pluginId, config);
            })
            .then(() => ApiClient.getPluginConfiguration(pluginId))
            .then(config => {
                renderConfiguration(config);
                saveStatus.textContent = 'Saved. Trigger threshold: ' + thresholdInput.value + '%.';
            })
            .catch(error => {
                console.error('Episode Prewarm: failed to save plugin configuration.', error);
                saveStatus.textContent = 'Could not save plugin configuration: ' + (error?.message || error);
            })
            .finally(() => {
                saveButton.disabled = false;
                Dashboard.hideLoadingMsg();
            });

        return false;
    }

    // Jellyfin dispatches pageshow on plugin page elements when navigating to them.
    page.addEventListener('pageshow', loadConfiguration);
    form.addEventListener('submit', saveConfiguration);
})();
</script>
</body>
</html>
